name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repository. Nothing here can push, publish or comment.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job names below (python, web, cpp) are the status checks that .github/rulesets/protect-main.json requires.
jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      # lesson / project frontmatter checks + every algorithm compared against scikit-learn
      - run: python -m pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # encrypted key storage (vault) and the .env relay
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # The static copy for GitHub Pages (no server, no Run buttons). Built on every pull request so a break is caught
      # before merge; only main uploads it for deployment.
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/out

  cpp:
    name: cpp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build --parallel
      - run: ctest --test-dir cpp/build --output-on-failure

  # Publishes the site once all three checks pass on main. Needs Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [python, web, cpp]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
