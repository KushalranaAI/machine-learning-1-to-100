name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repository. Nothing here can push, publish or comment.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job names below (python, web, cpp) are the status checks that .github/rulesets/protect-main.json requires.
jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      # lesson / project frontmatter checks + every algorithm compared against scikit-learn
      - run: python -m pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  cpp:
    name: cpp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build --parallel
      - run: ctest --test-dir cpp/build --output-on-failure
