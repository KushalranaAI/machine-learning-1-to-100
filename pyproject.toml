[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlscratch"
version = "1.0.0"
description = "Classical machine-learning algorithms implemented from scratch in NumPy, for learning."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
packages = ["mlscratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
